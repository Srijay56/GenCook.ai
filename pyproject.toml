[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gencook-ai"
version = "0.1.0"
description = "A desktop cooking assistant that turns ingredients into recipe ideas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.55,<3", "python-dotenv>=1,<2", "pyttsx3>=2.98,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
gencook = "gencook.main:main"

[project.urls]
Repository = "https://github.com/Srijay56/GenCook.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
